version: "3.8"

services:
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=sqlite+aiosqlite:////data/prefect.db
      - PREFECT_UI_API_URL=http://localhost:4200/api
    volumes:
      - prefect_data:/data
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0 --port 4200
    restart: unless-stopped

  flow-builder:
    build: .
    image: rental-pipeline:local
    command: echo "Flow image built"
    profiles: ["builder"]

  # ONE‑TIME INIT: creates work pool and deploys the flow (runs once, then exits)
  prefect-init:
    image: rental-pipeline:local
    container_name: prefect-init
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    volumes:
      - ./rental_data:/app/rental_data
      - ./rental_dbt:/app/rental_dbt
      - ./.dbt:/app/.dbt:ro # read-only flag
    command: >
      sh -c "
      echo 'Waiting for Prefect server...' &&
      sleep 5 &&
      prefect work-pool create docker-pool --type docker || true &&
      prefect deploy --name rental-pipeline
      "
    depends_on:
      prefect-server:
        condition: service_started
    restart: "no"          # runs once and exits

  # WORKER: will wait for init to complete (by retrying until pool exists)
  worker:
    image: rental-pipeline:local
    container_name: rental-worker
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - DATA_DIR=/app/rental_data
      - DBT_PROFILES_DIR=/app/.dbt
      - DBT_PROJECT_DIR=/app/rental_dbt
    volumes:
      - ./rental_data:/app/rental_data
      - ./rental_dbt:/app/rental_dbt
      - ./.dbt:/app/.dbt:ro
    command: >
      sh -c "
      echo 'Waiting for work pool to be created...' &&
      until prefect work-pool list | grep -q docker-pool; do
        sleep 2;
      done &&
      echo 'Work pool found, starting worker...' &&
      prefect worker start --pool docker-pool --type docker
      "
    depends_on:
      - prefect-server
      - prefect-init          # no condition – just ensures init starts first, but we still wait for pool
    restart: unless-stopped

  streamlit:
    image: rental-pipeline:local
    container_name: rental-streamlit
    environment:
      - DBT_PROFILES_DIR=/app/.dbt
      - DBT_PROJECT_DIR=/app/rental_dbt
    volumes:
      - ./rental_data:/app/rental_data:ro
      - ./.dbt:/app/.dbt:ro
    ports:
      - "8501:8501"
    command: ["uv", "run", "streamlit", "run", "scripts/export_streamlit.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped

volumes:
  prefect_data: